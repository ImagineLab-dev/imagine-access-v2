<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 700" fill="none">
  <!--
    Imagine Access — Logo estilo referencia
    Escudo relleno azul oscuro + QR blanco con 3 finder patterns clásicos
    + alignment pattern inferior derecho
  -->

  <defs>
    <linearGradient id="shield-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a2f55"/>
      <stop offset="35%" stop-color="#0f1e3d"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.12" r="0.55">
      <stop offset="0%" stop-color="#2a4a80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f1e3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ══════ ESCUDO RELLENO ══════ -->
  <path d="
    M 256 52
    L 432 128
    L 432 296
    C 432 408 348 476 256 508
    C 164 476 80 408 80 296
    L 80 128
    Z
  " fill="url(#shield-grad)" stroke="#1e3a6e" stroke-width="3" stroke-linejoin="round"/>

  <path d="
    M 256 52
    L 432 128
    L 432 296
    C 432 408 348 476 256 508
    C 164 476 80 408 80 296
    L 80 128
    Z
  " fill="url(#shine)"/>

  <clipPath id="qr-clip">
    <path d="
      M 256 56
      L 428 130
      L 428 296
      C 428 404 346 472 256 504
      C 166 472 84 404 84 296
      L 84 130
      Z
    "/>
  </clipPath>

  <g clip-path="url(#qr-clip)">
    <!--
      QR Grid basado en módulos de 12px
      21 columnas × ~22 filas
      x_origin = 256 - (10.5 * 12) = 130
      y_origin = 150
      col(c) → x = 130 + c*12
      row(r) → y = 150 + r*12
    -->

    <!-- ══════ FINDER TOP-LEFT (c0-6, r0-6) ══════ -->
    <!-- Exterior 7 mods = 84px -->
    <rect x="130" y="150" width="84" height="84" rx="5" fill="none" stroke="white" stroke-width="8"/>
    <!-- Centro 3 mods = 36px, offset 2 mods = 24px -->
    <rect x="154" y="174" width="36" height="36" rx="2" fill="white"/>

    <!-- ══════ FINDER TOP-RIGHT (c14-20, r0-6) ══════ -->
    <rect x="298" y="150" width="84" height="84" rx="5" fill="none" stroke="white" stroke-width="8"/>
    <rect x="322" y="174" width="36" height="36" rx="2" fill="white"/>

    <!-- ══════ FINDER BOTTOM-LEFT (c0-6, r14-20) ══════ -->
    <rect x="130" y="318" width="84" height="84" rx="5" fill="none" stroke="white" stroke-width="8"/>
    <rect x="154" y="342" width="36" height="36" rx="2" fill="white"/>

    <!-- ══════ ALIGNMENT PATTERN (c14-18, r14-18) ══════ -->
    <rect x="310" y="330" width="48" height="48" rx="3" fill="none" stroke="white" stroke-width="5"/>
    <rect x="325" y="345" width="18" height="18" rx="1" fill="white"/>

    <!-- ══════ TIMING HORIZONTAL (r6, y=222, c8→c12) ══════ -->
    <rect x="226" y="222" width="10" height="10" rx="1" fill="white"/>
    <rect x="250" y="222" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="222" width="10" height="10" rx="1" fill="white"/>

    <!-- ══════ TIMING VERTICAL (c6, x=202, r8→r12) ══════ -->
    <rect x="202" y="246" width="10" height="10" rx="1" fill="white"/>
    <rect x="202" y="270" width="10" height="10" rx="1" fill="white"/>
    <rect x="202" y="294" width="10" height="10" rx="1" fill="white"/>

    <!-- ══════ DATA MODULES ══════ -->
    <!-- Zona superior entre finders (c7-13, r0-6) — simétrico en eje c10.5 -->
    <!-- r0 (y=150) -->
    <rect x="226" y="150" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="150" width="10" height="10" rx="1" fill="white"/>
    <!-- r1 (y=162) -->
    <rect x="238" y="162" width="10" height="10" rx="1" fill="white"/>
    <rect x="262" y="162" width="10" height="10" rx="1" fill="white"/>
    <!-- r2 (y=174) -->
    <rect x="226" y="174" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="174" width="10" height="10" rx="1" fill="white"/>
    <rect x="250" y="174" width="10" height="10" rx="1" fill="white"/>
    <!-- r3 (y=186) -->
    <rect x="238" y="186" width="10" height="10" rx="1" fill="white"/>
    <rect x="262" y="186" width="10" height="10" rx="1" fill="white"/>
    <!-- r4 (y=198) -->
    <rect x="226" y="198" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="198" width="10" height="10" rx="1" fill="white"/>
    <!-- r5 (y=210) -->
    <rect x="238" y="210" width="10" height="10" rx="1" fill="white"/>
    <rect x="262" y="210" width="10" height="10" rx="1" fill="white"/>
    <rect x="250" y="210" width="10" height="10" rx="1" fill="white"/>

    <!-- Zona central derecha (c15-20, r8-12) — simétrico vertical -->
    <!-- r8 (y=246) -->
    <rect x="310" y="246" width="10" height="10" rx="1" fill="white"/>
    <rect x="370" y="246" width="10" height="10" rx="1" fill="white"/>
    <rect x="346" y="246" width="10" height="10" rx="1" fill="white"/>
    <!-- r9 (y=258) -->
    <rect x="322" y="258" width="10" height="10" rx="1" fill="white"/>
    <rect x="358" y="258" width="10" height="10" rx="1" fill="white"/>
    <!-- r10 (y=270) -->
    <rect x="310" y="270" width="10" height="10" rx="1" fill="white"/>
    <rect x="370" y="270" width="10" height="10" rx="1" fill="white"/>
    <rect x="346" y="270" width="10" height="10" rx="1" fill="white"/>
    <!-- r11 (y=282) -->
    <rect x="322" y="282" width="10" height="10" rx="1" fill="white"/>
    <rect x="358" y="282" width="10" height="10" rx="1" fill="white"/>
    <!-- r12 (y=294) -->
    <rect x="310" y="294" width="10" height="10" rx="1" fill="white"/>
    <rect x="370" y="294" width="10" height="10" rx="1" fill="white"/>

    <!-- Zona central (c7-13, r8-12) — el corazón del QR, simétrico -->
    <!-- r8 (y=246) -->
    <rect x="226" y="246" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="246" width="10" height="10" rx="1" fill="white"/>
    <!-- r9 (y=258) -->
    <rect x="238" y="258" width="10" height="10" rx="1" fill="white"/>
    <rect x="262" y="258" width="10" height="10" rx="1" fill="white"/>
    <rect x="250" y="258" width="10" height="10" rx="1" fill="white"/>
    <!-- r10 (y=270) -->
    <rect x="226" y="270" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="270" width="10" height="10" rx="1" fill="white"/>
    <!-- r11 (y=282) -->
    <rect x="250" y="282" width="10" height="10" rx="1" fill="white"/>
    <!-- r12 (y=294) -->
    <rect x="226" y="294" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="294" width="10" height="10" rx="1" fill="white"/>
    <rect x="250" y="294" width="10" height="10" rx="1" fill="white"/>

    <!-- Zona central izquierda (c0-6, r8-12) — simétrico vertical -->
    <rect x="130" y="246" width="10" height="10" rx="1" fill="white"/>
    <rect x="154" y="246" width="10" height="10" rx="1" fill="white"/>
    <rect x="178" y="246" width="10" height="10" rx="1" fill="white"/>
    <rect x="142" y="258" width="10" height="10" rx="1" fill="white"/>
    <rect x="166" y="258" width="10" height="10" rx="1" fill="white"/>
    <rect x="130" y="270" width="10" height="10" rx="1" fill="white"/>
    <rect x="178" y="270" width="10" height="10" rx="1" fill="white"/>
    <rect x="142" y="282" width="10" height="10" rx="1" fill="white"/>
    <rect x="166" y="282" width="10" height="10" rx="1" fill="white"/>
    <rect x="130" y="294" width="10" height="10" rx="1" fill="white"/>
    <rect x="154" y="294" width="10" height="10" rx="1" fill="white"/>
    <rect x="178" y="294" width="10" height="10" rx="1" fill="white"/>

    <!-- Fila separadora r13 (y=306) -->
    <rect x="226" y="306" width="10" height="10" rx="1" fill="white"/>
    <rect x="250" y="306" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="306" width="10" height="10" rx="1" fill="white"/>
    <rect x="310" y="306" width="10" height="10" rx="1" fill="white"/>
    <rect x="346" y="306" width="10" height="10" rx="1" fill="white"/>
    <rect x="382" y="306" width="10" height="10" rx="1" fill="white"/>

    <!-- Zona inferior derecha (c7-13, r14-20) — datos junto alignment -->
    <!-- r14 (y=318) -->
    <rect x="226" y="318" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="318" width="10" height="10" rx="1" fill="white"/>
    <!-- r15 (y=330) -->
    <rect x="250" y="330" width="10" height="10" rx="1" fill="white"/>
    <!-- r16 (y=342) -->
    <rect x="226" y="342" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="342" width="10" height="10" rx="1" fill="white"/>
    <!-- r17 (y=354) -->
    <rect x="238" y="354" width="10" height="10" rx="1" fill="white"/>
    <rect x="262" y="354" width="10" height="10" rx="1" fill="white"/>
    <!-- r18 (y=366) -->
    <rect x="226" y="366" width="10" height="10" rx="1" fill="white"/>
    <rect x="274" y="366" width="10" height="10" rx="1" fill="white"/>
    <rect x="250" y="366" width="10" height="10" rx="1" fill="white"/>
    <!-- r19 (y=378) -->
    <rect x="238" y="378" width="10" height="10" rx="1" fill="white"/>
    <rect x="262" y="378" width="10" height="10" rx="1" fill="white"/>
    <!-- r20 (y=390) -->
    <rect x="250" y="390" width="10" height="10" rx="1" fill="white"/>

    <!-- Datos sueltos zona inferior derecha -->
    <rect x="370" y="318" width="10" height="10" rx="1" fill="white"/>
    <rect x="382" y="342" width="10" height="10" rx="1" fill="white"/>
    <rect x="370" y="366" width="10" height="10" rx="1" fill="white"/>
    <rect x="382" y="390" width="10" height="10" rx="1" fill="white"/>
    <rect x="298" y="390" width="10" height="10" rx="1" fill="white"/>
    <rect x="298" y="366" width="10" height="10" rx="1" fill="white"/>
  </g>

  <!-- ══════ TIPOGRAFÍA ══════ -->
  <text x="256" y="568"
        text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="36" font-weight="300" letter-spacing="12"
        fill="white">IMAGINE</text>

  <text x="256" y="614"
        text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="36" font-weight="700" letter-spacing="12"
        fill="white">ACCESS</text>
</svg>