<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 700" fill="none">
  <!--
    Imagine Access — Variante 2: Escudo Angular + QR Concentrado
    QR como bloque compacto central rodeando la cerradura, escudo de bordes rectos
  -->

  <!-- Escudo exterior (bordes más angulares) -->
  <path d="
    M 256 40
    L 424 116
    L 424 280
    C 424 380 348 456 256 492
    C 164 456 88 380 88 280
    L 88 116
    Z
  " fill="none" stroke="white" stroke-width="12" stroke-linejoin="miter"/>

  <!-- QR Block central dentro del escudo -->
  <clipPath id="shield-clip-2">
    <path d="
      M 256 72
      L 396 136
      L 396 280
      C 396 364 332 432 256 464
      C 180 432 116 364 116 280
      L 116 136
      Z
    "/>
  </clipPath>

  <g clip-path="url(#shield-clip-2)">
    <!-- QR finder patterns (las 3 esquinas características) simulados -->
    <!-- Finder superior izquierdo -->
    <rect x="152" y="148" width="48" height="48" rx="2" fill="none" stroke="white" stroke-width="4"/>
    <rect x="160" y="156" width="32" height="32" rx="1" fill="none" stroke="white" stroke-width="2"/>
    <rect x="168" y="164" width="16" height="16" fill="white"/>

    <!-- Finder superior derecho -->
    <rect x="312" y="148" width="48" height="48" rx="2" fill="none" stroke="white" stroke-width="4"/>
    <rect x="320" y="156" width="32" height="32" rx="1" fill="none" stroke="white" stroke-width="2"/>
    <rect x="328" y="164" width="16" height="16" fill="white"/>

    <!-- Finder inferior izquierdo -->
    <rect x="152" y="308" width="48" height="48" rx="2" fill="none" stroke="white" stroke-width="4"/>
    <rect x="160" y="316" width="32" height="32" rx="1" fill="none" stroke="white" stroke-width="2"/>
    <rect x="168" y="324" width="16" height="16" fill="white"/>

    <!-- QR data modules (patrón disperso simétrico) -->
    <g>
      <!-- Columna izquierda -->
      <rect x="152" y="208" width="10" height="10" fill="white"/>
      <rect x="168" y="216" width="10" height="10" fill="white"/>
      <rect x="152" y="240" width="10" height="10" fill="white"/>
      <rect x="184" y="224" width="10" height="10" fill="white"/>
      <rect x="168" y="256" width="10" height="10" fill="white"/>
      <rect x="152" y="280" width="10" height="10" fill="white"/>
      <rect x="184" y="272" width="10" height="10" fill="white"/>

      <!-- Columna derecha (espejo) -->
      <rect x="350" y="208" width="10" height="10" fill="white"/>
      <rect x="334" y="216" width="10" height="10" fill="white"/>
      <rect x="350" y="240" width="10" height="10" fill="white"/>
      <rect x="318" y="224" width="10" height="10" fill="white"/>
      <rect x="334" y="256" width="10" height="10" fill="white"/>
      <rect x="350" y="280" width="10" height="10" fill="white"/>
      <rect x="318" y="272" width="10" height="10" fill="white"/>

      <!-- Zona superior centro -->
      <rect x="216" y="152" width="10" height="10" fill="white"/>
      <rect x="240" y="148" width="10" height="10" fill="white"/>
      <rect x="262" y="148" width="10" height="10" fill="white"/>
      <rect x="286" y="152" width="10" height="10" fill="white"/>
      <rect x="228" y="168" width="10" height="10" fill="white"/>
      <rect x="274" y="168" width="10" height="10" fill="white"/>

      <!-- Zona inferior -->
      <rect x="216" y="360" width="10" height="10" fill="white"/>
      <rect x="240" y="368" width="10" height="10" fill="white"/>
      <rect x="262" y="368" width="10" height="10" fill="white"/>
      <rect x="286" y="360" width="10" height="10" fill="white"/>
      <rect x="228" y="380" width="10" height="10" fill="white"/>
      <rect x="274" y="380" width="10" height="10" fill="white"/>
      <rect x="248" y="396" width="10" height="10" fill="white"/>

      <!-- Anillo medio alrededor de la cerradura -->
      <rect x="200" y="232" width="10" height="10" fill="white"/>
      <rect x="200" y="264" width="10" height="10" fill="white"/>
      <rect x="200" y="296" width="10" height="10" fill="white"/>
      <rect x="302" y="232" width="10" height="10" fill="white"/>
      <rect x="302" y="264" width="10" height="10" fill="white"/>
      <rect x="302" y="296" width="10" height="10" fill="white"/>
      <rect x="216" y="320" width="10" height="10" fill="white"/>
      <rect x="286" y="320" width="10" height="10" fill="white"/>
      <rect x="248" y="340" width="10" height="10" fill="white"/>
    </g>
  </g>

  <!-- Cerradura "i" central -->
  <circle cx="256" cy="228" r="24" fill="white"/>
  <rect x="241" y="268" width="30" height="88" rx="15" fill="white"/>

  <!-- Línea decorativa bajo escudo -->
  <rect x="176" y="508" width="160" height="2" rx="1" fill="white" opacity="0.2"/>

  <!-- IMAGINE -->
  <text x="256" y="554"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="38"
        font-weight="200"
        letter-spacing="14"
        fill="white">IMAGINE</text>

  <!-- ACCESS -->
  <text x="256" y="604"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="38"
        font-weight="700"
        letter-spacing="14"
        fill="white">ACCESS</text>
</svg>
