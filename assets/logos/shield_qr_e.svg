  <!-- Cerradura "i" -->
  <circle cx="256" cy="228" r="22" fill="white"/>
  <rect x="243" y="266" width="26" height="88" rx="13" fill="white"/>

  <!-- IMAGINE -->
  <text x="256" y="554" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="36" font-weight="300" letter-spacing="14" fill="white">IMAGINE</text>
  <!-- Separador -->
  <rect x="164" y="566" width="184" height="1" rx="0.5" fill="white" opacity="0.3"/>
  <!-- ACCESS -->
  <text x="256" y="602" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="36" font-weight="700" letter-spacing="14" fill="white">ACCESS</text>
</svg>