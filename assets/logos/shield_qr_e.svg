    <circle cx="196" cy="336" r="3" fill="white"/>
    <circle cx="316" cy="336" r="3" fill="white"/>

    <!-- Data dots — anillo interior (alrededor de la "i") -->
    <circle cx="212" cy="208" r="3" fill="white"/>
    <circle cx="300" cy="208" r="3" fill="white"/>
    <circle cx="208" cy="316" r="3" fill="white"/>
    <circle cx="304" cy="316" r="3" fill="white"/>
    <circle cx="212" cy="340" r="3" fill="white"/>
    <circle cx="300" cy="340" r="3" fill="white"/>

    <!-- Inferior -->
    <circle cx="176" cy="356" r="3" fill="white"/>
    <circle cx="336" cy="356" r="3" fill="white"/>
    <circle cx="196" cy="376" r="3" fill="white"/>
    <circle cx="316" cy="376" r="3" fill="white"/>
    <circle cx="212" cy="396" r="3" fill="white"/>
    <circle cx="300" cy="396" r="3" fill="white"/>
    <circle cx="232" cy="416" r="3" fill="white"/>
    <circle cx="280" cy="416" r="3" fill="white"/>
    <circle cx="248" cy="436" r="3" fill="white"/>
    <circle cx="264" cy="436" r="3" fill="white"/>
