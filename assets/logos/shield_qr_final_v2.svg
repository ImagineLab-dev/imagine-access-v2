    <rect x="151" y="155" width="40" height="40" rx="4" fill="white"/>
    
    <!-- Top-Right -->
    <rect x="297" y="133" width="84" height="84" rx="10" fill="none" stroke="white" stroke-width="12"/>
    <rect x="319" y="155" width="40" height="40" rx="4" fill="white"/>

    <!-- Bottom-Left -->
