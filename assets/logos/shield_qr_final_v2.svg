<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 700" fill="none">
  <!--
    Imagine Access — Rediseño definitivo
    1. Escudo exterior azul oscuro metálico (como en la referencia)
    2. Escudo interno brillante ("dentro de otro escudo interno")
    3. QR code con 4 Finders (cuadrantes idénticos) para simetría ABSOLUTA
       Resuelve la asimetría molestosa del estándar QR manteniendo un look tech impecable.
  -->

  <defs>
    <!-- Gradiente del escudo exterior metálico oscuro -->
    <linearGradient id="shield-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#122547"/>
      <stop offset="50%" stop-color="#0a152e"/>
      <stop offset="100%" stop-color="#040917"/>
    </linearGradient>

    <!-- Resplandor central interior -->
    <radialGradient id="center-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#1d488f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a152e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ══════ ESCUDO EXTERIOR ══════ -->
  <!-- Relleno y borde oscuro -->
  <path d="
    M 256 40
    L 436 120
    L 436 296
    C 436 404 352 472 256 508
    C 160 472 76 404 76 296
    L 76 120
    Z
  " fill="url(#shield-grad)" stroke="#1c3e73" stroke-width="4" stroke-linejoin="round"/>

  <!-- Brillo central -->
  <path d="
    M 256 40
    L 436 120
    L 436 296
    C 436 404 352 472 256 508
    C 160 472 76 404 76 296
    L 76 120
    Z
  " fill="url(#center-glow)"/>

  <!-- ══════ ESCUDO INTERNO ══════ -->
  <path d="
    M 256 68
    L 406 136
    L 406 292
    C 406 384 336 440 256 472
    C 176 440 106 384 106 292
    L 106 136
    Z
  " fill="#4da2ff" opacity="0.05"/>

  <path d="
    M 256 68
    L 406 136
    L 406 292
    C 406 384 336 440 256 472
    C 176 440 106 384 106 292
    L 106 136
    Z
  " fill="none" stroke="#4da2ff" stroke-width="2" opacity="0.6"/>

  <!-- ══════ GRID QR SIMÉTRICO PERFECTO (4 Cuadrantes) ══════ -->
  <!-- Centrado y escalado al 72% para encajar perfectamente -->
  <g transform="matrix(0.72, 0, 0, 0.72, 71.68, 80)">

    <!-- ==== 4 FINDER PATTERNS (Esquinas) ==== -->
