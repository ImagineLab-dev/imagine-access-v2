<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <!--
    Imagine Access — Preview Sheet (fondo oscuro para visualizar los logos blancos)
    Este archivo es SOLO para previsualización, no para producción
  -->
  
  <!-- Fondo oscuro -->
  <rect width="1200" height="800" fill="#1a1a2e"/>
  
  <!-- Grid lines -->
  <line x1="400" y1="0" x2="400" y2="800" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="800" y1="0" x2="800" y2="800" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  
  <!-- === 1. LOGO PORTAL (arriba izquierda) === -->
  <g transform="translate(80, 60) scale(0.5)">
    <path d="
      M 156 464 L 156 224
      C 156 168.8 172.4 120 206 86
      C 228 64 241.2 56 256 52
      C 270.8 56 284 64 306 86
      C 339.6 120 356 168.8 356 224
      L 356 464 L 316 464 L 316 224
      C 316 180 304 144 280 118
      C 268 106 262 100 256 96
      C 250 100 244 106 232 118
      C 208 144 196 180 196 224
      L 196 464 Z
    " fill="white"/>
    <rect x="136" y="456" width="240" height="8" rx="4" fill="white"/>
    <circle cx="256" cy="280" r="28" fill="white"/>
    <rect x="250" y="300" width="12" height="48" rx="6" fill="white"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white" opacity="0.4">PORTAL</text>
  
  <!-- === 2. LOGO ESCUDO (arriba centro) === -->
  <g transform="translate(280, 50) scale(0.52)">
    <path d="
      M 256 56 L 408 120 L 408 264
      C 408 360 340 432 256 464
      C 172 432 104 360 104 264 L 104 120 Z
    " fill="none" stroke="white" stroke-width="16" stroke-linejoin="round"/>
    <path d="
      M 256 100 L 372 148 L 372 268
      C 372 340 320 396 256 420
      C 192 396 140 340 140 268 L 140 148 Z
    " fill="none" stroke="white" stroke-width="8" stroke-linejoin="round" opacity="0.35"/>
    <circle cx="256" cy="196" r="20" fill="white"/>
    <rect x="242" y="236" width="28" height="100" rx="14" fill="white"/>
  </g>
  <text x="555" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white" opacity="0.4">ESCUDO</text>

  <!-- === 3. MONOGRAMA iA (arriba derecha) === -->
  <g transform="translate(680, 55) scale(0.5)">
    <path d="
      M 256 72 L 420 440 L 376 440 L 340 352 L 172 352 L 136 440 L 92 440 Z
      M 256 160 L 196 312 L 316 312 Z
    " fill="white" fill-rule="evenodd"/>
    <rect x="184" y="320" width="144" height="8" rx="4" fill="white"/>
    <circle cx="256" cy="52" r="16" fill="white"/>
    <rect x="92" y="452" width="328" height="4" rx="2" fill="white" opacity="0.3"/>
  </g>
  <text x="925" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white" opacity="0.4">MONOGRAMA iA</text>
  
  <!-- === 4. LOGO HORIZONTAL (abajo) === -->
  <g transform="translate(80, 440) scale(0.7)">
    <!-- Ícono portal mini -->
    <g transform="scale(0.4)">
      <path d="
        M 156 464 L 156 224
        C 156 168.8 172.4 120 206 86
        C 228 64 241.2 56 256 52
        C 270.8 56 284 64 306 86
        C 339.6 120 356 168.8 356 224
        L 356 464 L 316 464 L 316 224
        C 316 180 304 144 280 118
        C 268 106 262 100 256 96
        C 250 100 244 106 232 118
        C 208 144 196 180 196 224
        L 196 464 Z
      " fill="white"/>
      <rect x="136" y="456" width="240" height="8" rx="4" fill="white"/>
      <circle cx="256" cy="280" r="28" fill="white"/>
      <rect x="250" y="300" width="12" height="48" rx="6" fill="white"/>
    </g>
    <!-- Texto -->
    <text x="230" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="300" letter-spacing="10" fill="white">IMAGINE</text>
    <text x="230" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="600" letter-spacing="10" fill="white">ACCESS</text>
    <rect x="230" y="90" width="410" height="1.2" rx="0.6" fill="white" opacity="0.3"/>
  </g>
  <text x="600" y="730" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white" opacity="0.4">LOGO HORIZONTAL</text>
  
  <!-- Título del sheet -->
  <text x="600" y="785" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="white" opacity="0.2" letter-spacing="6">IMAGINE ACCESS — BRAND MARKS — SVG VECTOR</text>
</svg>
