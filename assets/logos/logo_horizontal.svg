<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" fill="none">
  <!--
    Imagine Access — Logo Horizontal (Ícono + Texto)
    Estilo: Sobrio, simétrico, blanco, tipografía geométrica sans-serif
  -->
  
  <!-- === ÍCONO (portal con cerradura) === -->
  <g transform="translate(40, 20) scale(0.42)">
    <!-- Arco del portal -->
    <path d="
      M 156 464
      L 156 224
      C 156 168.8 172.4 120 206 86
      C 228 64 241.2 56 256 52
      C 270.8 56 284 64 306 86
      C 339.6 120 356 168.8 356 224
      L 356 464
      L 316 464
      L 316 224
      C 316 180 304 144 280 118
      C 268 106 262 100 256 96
      C 250 100 244 106 232 118
      C 208 144 196 180 196 224
      L 196 464
      Z
    " fill="white"/>
    <rect x="136" y="456" width="240" height="8" rx="4" fill="white"/>
    <circle cx="256" cy="280" r="28" fill="white"/>
    <rect x="250" y="300" width="12" height="48" rx="6" fill="white"/>
  </g>
  
  <!-- === TEXTO === -->
  <g fill="white">
    <!-- IMAGINE -->
    <text x="280" y="108" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="56" 
          font-weight="300" 
          letter-spacing="12"
          fill="white">IMAGINE</text>
    
    <!-- ACCESS -->
    <text x="280" y="172" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="56" 
          font-weight="600" 
          letter-spacing="12"
          fill="white">ACCESS</text>
    
    <!-- Línea separadora sutil -->
    <rect x="280" y="118" width="480" height="1.5" rx="0.75" fill="white" opacity="0.4"/>
  </g>
</svg>
