<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 700" fill="none">
  <!--
    Imagine Access — Variante 3: Escudo Redondeado + QR como Circuito
    QR estilizado como líneas de circuito/conexión, aspecto tech elegante
  -->

  <!-- Escudo exterior redondeado -->
  <path d="
    M 256 44
    L 416 112
    C 420 114 424 118 424 122
    L 424 276
    C 424 380 344 456 256 492
    C 168 456 88 380 88 276
    L 88 122
    C 88 118 92 114 96 112
    Z
  " fill="none" stroke="white" stroke-width="10" stroke-linejoin="round"/>

  <!-- Contorno interior (eco) -->
  <path d="
    M 256 76
    L 392 132
    L 392 276
    C 392 360 324 428 256 460
    C 188 428 120 360 120 276
    L 120 132
    Z
  " fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" opacity="0.15"/>

  <!-- QR como circuito/líneas conectadas (simétrico) -->
  <clipPath id="shield-clip-3">
    <path d="
      M 256 76 L 392 132 L 392 276
      C 392 360 324 428 256 460
      C 188 428 120 360 120 276 L 120 132 Z
    "/>
  </clipPath>

  <g clip-path="url(#shield-clip-3)" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Líneas horizontales con nodos -->
    <line x1="140" y1="160" x2="200" y2="160"/>
    <line x1="312" y1="160" x2="372" y2="160"/>
    <circle cx="200" cy="160" r="3" fill="white"/>
    <circle cx="312" cy="160" r="3" fill="white"/>

    <line x1="152" y1="192" x2="208" y2="192"/>
    <line x1="304" y1="192" x2="360" y2="192"/>
    <circle cx="208" cy="192" r="3" fill="white"/>
    <circle cx="304" cy="192" r="3" fill="white"/>

    <line x1="148" y1="224" x2="216" y2="224"/>
    <line x1="296" y1="224" x2="364" y2="224"/>

    <line x1="144" y1="256" x2="216" y2="256"/>
    <line x1="296" y1="256" x2="368" y2="256"/>

    <line x1="148" y1="288" x2="220" y2="288"/>
    <line x1="292" y1="288" x2="364" y2="288"/>
    <circle cx="220" cy="288" r="3" fill="white"/>
    <circle cx="292" cy="288" r="3" fill="white"/>

    <line x1="156" y1="320" x2="216" y2="320"/>
    <line x1="296" y1="320" x2="356" y2="320"/>

    <line x1="168" y1="352" x2="212" y2="352"/>
    <line x1="300" y1="352" x2="344" y2="352"/>
    <circle cx="212" cy="352" r="3" fill="white"/>
    <circle cx="300" cy="352" r="3" fill="white"/>

    <line x1="184" y1="384" x2="220" y2="384"/>
    <line x1="292" y1="384" x2="328" y2="384"/>

    <!-- Verticales de conexión (izquierda) -->
    <line x1="176" y1="160" x2="176" y2="192"/>
    <line x1="168" y1="224" x2="168" y2="288"/>
    <line x1="192" y1="320" x2="192" y2="384"/>

    <!-- Verticales de conexión (derecha, espejo) -->
    <line x1="336" y1="160" x2="336" y2="192"/>
    <line x1="344" y1="224" x2="344" y2="288"/>
    <line x1="320" y1="320" x2="320" y2="384"/>

    <!-- Nodos esquina -->
    <rect x="156" y="220" width="8" height="8" rx="1" fill="white"/>
    <rect x="348" y="220" width="8" height="8" rx="1" fill="white"/>
    <rect x="156" y="280" width="8" height="8" rx="1" fill="white"/>
    <rect x="348" y="280" width="8" height="8" rx="1" fill="white"/>
  </g>

  <!-- Cerradura "i" central -->
  <circle cx="256" cy="224" r="24" fill="white"/>
  <rect x="241" y="264" width="30" height="92" rx="15" fill="white"/>

  <!-- Línea fina división -->
  <rect x="160" y="510" width="192" height="1" rx="0.5" fill="white" opacity="0.25"/>

  <!-- IMAGINE — espaciado generoso -->
  <text x="256" y="552"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="36"
        font-weight="300"
        letter-spacing="16"
        fill="white">IMAGINE</text>

  <!-- ACCESS — bold, mismo espaciado -->
  <text x="256" y="600"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="36"
        font-weight="600"
        letter-spacing="16"
        fill="white">ACCESS</text>
</svg>
