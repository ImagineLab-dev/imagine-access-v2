<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Imagine Access — Control de acceso a eventos y gestión de tickets.">
  <meta name="theme-color" content="#0A0A0B">

  <!-- iOS: instalación en pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imagine Access">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Precarga del bundle principal: es de lejos el archivo más pesado y
       arrancar su descarga antes de que el bootstrap lo pida recorta la
       primera carga, que es lo que más se siente en 4G. -->
  <link rel="preload" href="main.dart.js" as="script">

  <title>Imagine Access</title>

  <!-- Canonical de la raíz. El subdominio `super-admin.imaginecloud.digital`
       apunta al MISMO `public_html`, así que esta página también se sirve
       idéntica desde dos nombres. Sin esta línea, un buscador ve dos sitios
       iguales y reparte la fuerza del dominio entre los dos. -->
  <link rel="canonical" href="https://imaginecloud.digital/">

  <!--
    ZXing self-hosteado.

    mobile_scanner lo descargaría de https://unpkg.com/@zxing/library@0.21.3 en
    runtime, lo que rompe el escaneo sin internet — el caso de uso principal en
    la puerta. El plugin salta su propia descarga si encuentra un script con
    este id (mobile_scanner/lib/src/web/barcode_reader.dart:84).

    El id "mobile-scanner-barcode-reader" es contrato con el plugin: NO cambiarlo.
    La versión tiene que seguir siendo 0.21.3, la que el plugin espera
    (mobile_scanner/lib/src/web/zxing/zxing_barcode_reader.dart:60).
  -->
  <script id="mobile-scanner-barcode-reader" src="js/zxing-0.21.3.min.js"></script>

  <!--
    Lector de QR sobre el decodificador NATIVO del navegador.

    ZXing (arriba) decodifica por software en el hilo principal. En Chromium
    existe `BarcodeDetector`, respaldado en Android por el motor de códigos del
    sistema: entre uno y dos órdenes de magnitud más rápido y mucho más
    tolerante al ángulo y al desenfoque.

    Los dos conviven sobre el mismo <video>: gana el que reconozca primero. Si
    el navegador no tiene decodificador nativo —Safari en iPhone— este módulo se
    apaga solo y queda ZXing, así que nunca hay una pantalla sin escáner.
  -->
  <script src="js/lector.js"></script>

  <!--
    Pantalla de carga.

    El fondo por defecto de una página es blanco, y el bundle de Flutter pesa
    varios MB: sin esto, el arranque es un destello blanco de varios segundos
    seguido de un salto brusco a la app. Pintar html y body del color de marca
    desde el primer byte elimina el destello incluso antes de que este CSS
    termine de parsearse.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0B;
      overscroll-behavior: none;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background-color: #0A0A0B;
      transition: opacity 280ms ease-out;
    }

    #app-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #app-splash img {
      width: 96px;
      height: 96px;
      border-radius: 0;
      animation: splash-pulse 1.8s ease-in-out infinite;
    }

    #app-splash .bar {
      width: 140px;
      height: 3px;
      border-radius: 0;
      background: #1B1B1D;
      overflow: hidden;
    }

    #app-splash .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 0;
      background: #AED500;
      animation: splash-slide 1.2s ease-in-out infinite;
    }

    @keyframes splash-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .55; }
    }

    @keyframes splash-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Respeta a quien pidió menos movimiento en el sistema. */
    @media (prefers-reduced-motion: reduce) {
      #app-splash img,
      #app-splash .bar::after { animation: none; }
      #app-splash .bar::after { width: 100%; }
    }

    /* Turnstile.
       Anclado abajo y centrado, no a pantalla completa: la capa que cubría todo
       tapaba el formulario que el usuario está por completar. Como Flutter
       pinta sobre un canvas, el widget vive por encima con z-index; no puede ir
       dentro de la tarjeta de acceso, que es pintura, no DOM.
       Solo se muestra en las pantallas de acceso — lo pide Dart. */
    #turnstile-container {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 10000;
    }

    #turnstile-container.visible { display: block; }

    /* En pantallas bajas el widget se comería el formulario. Ahí se achica en
       vez de desaparecer: dejar de mostrarlo justo donde menos espacio hay
       sería quitar la señal precisamente a quien peor ve la pantalla. */
    @media (max-height: 620px) {
      #turnstile-container {
        bottom: 8px;
        transform: translateX(-50%) scale(.8);
        transform-origin: bottom center;
      }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Cargando Imagine Access">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>

  <div id="turnstile-container"></div>

  <!-- PUENTE HACIA LA LANDING. No es decoración: es cómo se descubre.

       Esta raíz sirve la aplicación, que es una cáscara de JavaScript sin
       contenido que un buscador pueda indexar. La página que explica y vende
       el producto vive en /landing/, y hasta el 07/08/2026 NADA la enlazaba:
       era una isla. Un rastreador llega al dominio, encuentra una cáscara
       vacía, no ve ninguna salida, y se va.

       Este enlace es la salida. Va en el HTML plano —no lo dibuja Flutter—
       así que existe antes de que corra una sola línea de la aplicación, que
       es exactamente cuando el rastreador mira.

       Se oculta a la vista con `clip`, la técnica que usan los saltos de
       accesibilidad: el elemento sigue en el árbol, sigue siendo enfocable y
       sigue siendo un enlace real para el rastreador. NO se usa
       `display:none` ni `visibility:hidden`, que además de sacarlo del árbol
       accesible son las dos formas que un buscador puede leer como intento de
       esconderle contenido.

       Al llegar por teclado se vuelve visible: para alguien que navega sin
       mouse es un atajo legítimo a la información del producto. -->
  <a href="/landing/" id="ir-a-landing">Qué es Imagine Access</a>
  <style>
    #ir-a-landing {
      position: absolute; left: 8px; top: 8px;
      width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      color: #AED500; background: #0A0A0B; text-decoration: none;
      font: 600 14px/1 system-ui, sans-serif; padding: 10px 14px; z-index: 10000;
    }
    #ir-a-landing:focus {
      width: auto; height: auto; overflow: visible;
      clip: auto; clip-path: none; border: 1px solid #AED500;
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>
  <script src="js/splash.js"></script>
  <script src="js/pwa.js" defer></script>
  <script src="js/install.js" defer></script>
  <script src="js/turnstile.js" defer></script>
  <script src="js/camara.js" defer></script>
  <script src="js/meta-pixel.js" defer></script>

  <!-- Meta Pixel sin JavaScript. Es la única parte que queda en el HTML porque
       tiene que ser una etiqueta, no un script. -->
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=1083477920911623&ev=PageView&noscript=1"
  /></noscript>
</body>
</html>
