<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Imagine Access — Control de acceso a eventos y gestión de tickets.">
  <meta name="theme-color" content="#0B0F16">

  <!-- iOS: instalación en pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imagine Access">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Precarga del bundle principal: es de lejos el archivo más pesado y
       arrancar su descarga antes de que el bootstrap lo pida recorta la
       primera carga, que es lo que más se siente en 4G. -->
  <link rel="preload" href="main.dart.js" as="script">

  <title>Imagine Access</title>

  <!--
    ZXing self-hosteado.

    mobile_scanner lo descargaría de https://unpkg.com/@zxing/library@0.21.3 en
    runtime, lo que rompe el escaneo sin internet — el caso de uso principal en
    la puerta. El plugin salta su propia descarga si encuentra un script con
    este id (mobile_scanner/lib/src/web/barcode_reader.dart:84).

    El id "mobile-scanner-barcode-reader" es contrato con el plugin: NO cambiarlo.
    La versión tiene que seguir siendo 0.21.3, la que el plugin espera
    (mobile_scanner/lib/src/web/zxing/zxing_barcode_reader.dart:60).
  -->
  <script id="mobile-scanner-barcode-reader" src="js/zxing-0.21.3.min.js"></script>

  <!--
    Pantalla de carga.

    El fondo por defecto de una página es blanco, y el bundle de Flutter pesa
    varios MB: sin esto, el arranque es un destello blanco de varios segundos
    seguido de un salto brusco a la app. Pintar html y body del color de marca
    desde el primer byte elimina el destello incluso antes de que este CSS
    termine de parsearse.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0B0F16;
      overscroll-behavior: none;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background-color: #0B0F16;
      transition: opacity 280ms ease-out;
    }

    #app-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #app-splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      animation: splash-pulse 1.8s ease-in-out infinite;
    }

    #app-splash .bar {
      width: 140px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }

    #app-splash .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #4A9EFF;
      animation: splash-slide 1.2s ease-in-out infinite;
    }

    @keyframes splash-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .55; }
    }

    @keyframes splash-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Respeta a quien pidió menos movimiento en el sistema. */
    @media (prefers-reduced-motion: reduce) {
      #app-splash img,
      #app-splash .bar::after { animation: none; }
      #app-splash .bar::after { width: 100%; }
    }

    /* Turnstile.
       Anclado abajo y centrado, no a pantalla completa: la capa que cubría todo
       tapaba el formulario que el usuario está por completar. Como Flutter
       pinta sobre un canvas, el widget vive por encima con z-index; no puede ir
       dentro de la tarjeta de acceso, que es pintura, no DOM.
       Solo se muestra en las pantallas de acceso — lo pide Dart. */
    #turnstile-container {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 10000;
    }

    #turnstile-container.visible { display: block; }

    /* En pantallas bajas el widget se comería el formulario. Ahí se achica en
       vez de desaparecer: dejar de mostrarlo justo donde menos espacio hay
       sería quitar la señal precisamente a quien peor ve la pantalla. */
    @media (max-height: 620px) {
      #turnstile-container {
        bottom: 8px;
        transform: translateX(-50%) scale(.8);
        transform-origin: bottom center;
      }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Cargando Imagine Access">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>

  <div id="turnstile-container"></div>

  <script src="flutter_bootstrap.js" async></script>
  <script src="js/splash.js"></script>
  <script src="js/pwa.js" defer></script>
  <script src="js/install.js" defer></script>
  <script src="js/turnstile.js" defer></script>
  <script src="js/camara.js" defer></script>
</body>
</html>
